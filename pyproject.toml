[project]
name = "datestamp-ocr"
version = "0.1.0"
description = "Read analog date stamps from scanned photos and write photographed dates into EXIF metadata."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.4",
    "opencv-python-headless==4.11.0.86",
    "Pillow==11.1.0",
    "scikit-learn==1.6.1",
    "scipy==1.15.2",
    "onnxruntime==1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
]

[project.scripts]
datestamp = "datestamp.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datestamp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
